name: Gameplay recovery native packages
on:
  push:
    branches: [work/mobile-controls-20261015, work/gameplay-recovery-20261015]
    paths: ['game/**', 'tools/**', '.gitattributes', 'integration/content-import/capabilities.json', '.github/workflows/mobile-quality.yml']
permissions:
  contents: read
concurrency:
  group: gameplay-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: baram-windows-private
    env:
      PRIVATE_REPO: ${{ vars.BARAM_PRIVATE_REPOSITORY || 'irewon1-lgtm/baram-windows-private' }}
      GH_TOKEN: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Check private vault
        run: test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
          path: vault
          persist-credentials: false
      - name: Build exact signed universal player APK
        working-directory: source
        run: |
          python -m pip install Pillow==11.3.0 cryptography jsonschema==4.25.1
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o godot.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  godot.zip' | sha256sum --check
          unzip -q godot.zip -d editor
          chmod +x editor/Godot_v4.6.3-stable_linux.x86_64
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -o templates.tpz
          echo '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8  templates.tpz' | sha256sum --check
          unzip -q templates.tpz templates/android_release.apk templates/android_debug.apk
          python tools/restore_private_runtime.py --vault ../vault --out ../vault/runtime
          python tools/prepare_recovery_content.py --runtime ../vault/runtime --output ../runtime-recovery --report recovery-content.json
          python tools/android_ci.py --runtime ../runtime-recovery --godot "$PWD/editor/Godot_v4.6.3-stable_linux.x86_64" --template templates/android_release.apk --sdk "$ANDROID_HOME" --signing ../vault/android/android-signing.json --universal --out android-build
          python tools/android_ci.py --runtime ../runtime-recovery --godot "$PWD/editor/Godot_v4.6.3-stable_linux.x86_64" --template templates/android_debug.apk --sdk "$ANDROID_HOME" --signing ../vault/android/android-signing.json --universal --verification --out android-recovery-check
          mkdir -p deliverable
          cp recovery-content.json deliverable/
          cp android-build/baram-Android-arm64.apk deliverable/baram-Android-update.apk
          cp android-build/android-build.json android-build/signature.log deliverable/
          cp android-recovery-check/android-build.json deliverable/android-verification-build.json
          cp android-recovery-check/signature.log deliverable/android-verification-signature.log
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install final APK and exercise real Android input
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            python source/tools/quality_android_input.py --apk source/deliverable/baram-Android-update.apk --out source/deliverable/android-evidence --world runtime-recovery/private_assets/source_maps/world.json
            python source/tools/quality_recovery_android.py --apk source/android-recovery-check/baram-Android-verification.apk --out source/deliverable/android-recovery-evidence --source-sha ${{ github.sha }}
      - name: Encrypt private artifacts
        if: always()
        working-directory: source
        run: |
          python tools/seal_quality_artifacts.py --signing ../vault/android/android-signing.json --source deliverable --output android-quality.sealed
          if [ -d deliverable/android-evidence ]; then
            python tools/seal_quality_artifacts.py --signing ../vault/android/android-signing.json --source deliverable/android-evidence --output android-evidence.sealed
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence-encrypted
          path: source/android-evidence.sealed
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-quality-encrypted
          path: source/android-quality.sealed
          retention-days: 1
  windows:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 45
    environment: baram-windows-private
    env:
      PRIVATE_REPO: ${{ vars.BARAM_PRIVATE_REPOSITORY || 'irewon1-lgtm/baram-windows-private' }}
      GH_TOKEN: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Check private vault
        shell: pwsh
        run: |
          if (-not (gh api "repos/$env:PRIVATE_REPO" | ConvertFrom-Json).private) { throw 'Private vault required' }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
          path: vault
          persist-credentials: false
      - name: Build and verify actual Windows EXE
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install Pillow==11.3.0 cryptography jsonschema==4.25.1
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile editor.zip
          if ((Get-FileHash editor.zip -Algorithm SHA256).Hash.ToLower() -ne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'Editor digest mismatch' }
          Expand-Archive editor.zip editor
          $godot = (Get-ChildItem editor -Filter '*.exe' | Where-Object { $_.Name -notmatch 'console' } | Select-Object -First 1).FullName
          python tools/restore_private_runtime.py --vault ../vault --out ../vault/runtime
          if ($LASTEXITCODE) { throw 'Runtime failure' }
          python tools/prepare_recovery_content.py --runtime ../vault/runtime --output ../runtime-recovery --report recovery-content.json
          if ($LASTEXITCODE) { throw 'Content integration failure' }
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz' -OutFile templates.tpz
          if ((Get-FileHash templates.tpz -Algorithm SHA256).Hash.ToLower() -ne '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8') { throw 'Template archive digest mismatch' }
          python -c "import zipfile; zipfile.ZipFile('templates.tpz').extract('templates/windows_release_x86_64.exe')"
          if ($LASTEXITCODE) { throw 'Template extraction failure' }
          if ((Get-FileHash templates/windows_release_x86_64.exe -Algorithm SHA256).Hash.ToLower() -ne '91724f15024a3a545e28ccd83134403d31ce2323a38e51c95e4dfa282f732ab6') { throw 'Official Windows template digest mismatch' }
          python tools/windows_ci.py build --runtime ../runtime-recovery --template templates/windows_release_x86_64.exe --godot "$godot" --out player-check
          if ($LASTEXITCODE) { throw 'Build failure' }
          python tools/windows_ci.py verify --out player-check
          if ($LASTEXITCODE) { throw 'Windows native regression failed' }
          # Private vault was checked above; only the encrypted archive is uploaded.
          $env:BARAM_PRIVATE_DELIVERY_VERIFIED = 'true'
          python tools/windows_ci.py archive --out player-check --require-windows
          if ($LASTEXITCODE) { throw 'Windows native archive gate failed' }
          New-Item -ItemType Directory deliverable -Force
          Copy-Item recovery-content.json deliverable/
          Copy-Item player-check/*.zip deliverable/
          Copy-Item player-check/build.json deliverable/
          Copy-Item player-check/evidence deliverable/ -Recurse
      - name: Seal private output
        if: always()
        shell: pwsh
        working-directory: source
        run: |
          New-Item -ItemType Directory deliverable -Force
          Copy-Item player-check/*.log deliverable/ -ErrorAction SilentlyContinue
          python tools/seal_quality_artifacts.py --signing ../vault/android/android-signing.json --source deliverable --output windows-quality.sealed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-quality-encrypted
          path: source/windows-quality.sealed
          retention-days: 1
  android_pointers:
    needs: android
    if: always() && needs.android.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: baram-windows-private
    env:
      PRIVATE_REPO: ${{ vars.BARAM_PRIVATE_REPOSITORY || 'irewon1-lgtm/baram-windows-private' }}
      GH_TOKEN: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Check private vault
        run: test "$(gh api repos/$PRIVATE_REPO --jq .private)" = true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
          path: vault
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: android-quality-encrypted
          path: sealed
      - name: Recover the identical tested APK and compile OS input driver
        run: |
          python -m pip install cryptography
          python source/tools/seal_quality_artifacts.py --signing vault/android/android-signing.json --decrypt sealed/android-quality.sealed --output player.zip
          unzip -j player.zip baram-Android-update.apk -d player
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
          mkdir -p pointer-classes pointer-dex
          javac -source 8 -target 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d pointer-classes source/qa/android/PointerDriver.java
          "$ANDROID_HOME/build-tools/35.0.1/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output pointer-dex pointer-classes/PointerDriver.class
          (cd pointer-dex && zip ../baram-pointer.jar classes.dex)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native OS two-finger input on identical APK
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python source/qa/android/multitouch.py --apk player/baram-Android-update.apk --driver baram-pointer.jar --out pointer-evidence
      - name: Seal native pointer evidence
        if: always()
        run: |
          mkdir -p pointer-evidence
          python source/tools/seal_quality_artifacts.py --signing vault/android/android-signing.json --source pointer-evidence --output pointers.sealed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-pointers-encrypted
          path: pointers.sealed
          retention-days: 1
