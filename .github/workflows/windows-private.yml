name: Private Windows player build and delivery
# Install this workflow and runtime/ in a PRIVATE build repository. The public
# source repository never receives original assets or plaintext player ZIPs.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths: ['runtime/**', '.github/workflows/windows-private.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: private-windows-player
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      BARAM_PRIVATE_REPOSITORY: 'true'
    steps:
      - name: Refuse plaintext output from a public repository
        shell: pwsh
        run: |
          if ('${{ github.event.repository.private }}' -ne 'true') { throw 'Private repository required' }
      - uses: actions/checkout@v4
        with:
          path: vault
      - name: Read current development commit and skip unchanged verified builds
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $sha = ((git ls-remote https://github.com/irewon1-lgtm/baram-1998-singleplayer.git refs/heads/codex/game-core) -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Missing source SHA' }
          $runtimeHash = (Get-FileHash vault/runtime/PACKAGE_MANIFEST.json -Algorithm SHA256).Hash.ToLower().Substring(0,12)
          $name = "windows-x64-$sha-$runtimeHash"
          $artifacts = gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" | ConvertFrom-Json
          $done = @($artifacts.artifacts | Where-Object { $_.name -eq $name -and -not $_.expired }).Count -gt 0
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "artifact=$name" >> $env:GITHUB_OUTPUT
          "needed=$(-not $done)" >> $env:GITHUB_OUTPUT
      - name: Checkout exact public development source
        if: steps.source.outputs.needed == 'True'
        shell: pwsh
        run: |
          git clone --single-branch --branch codex/game-core https://github.com/irewon1-lgtm/baram-1998-singleplayer.git source
          git -C source checkout --detach '${{ steps.source.outputs.sha }}'
      - uses: actions/setup-python@v5
        if: steps.source.outputs.needed == 'True'
        with:
          python-version: '3.12'
      - name: Download and verify official Windows build editor
        if: steps.source.outputs.needed == 'True'
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0 psutil==7.0.0
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile editor.zip
          if ((Get-FileHash editor.zip -Algorithm SHA256).Hash.ToLower() -ne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'Editor digest mismatch' }
          Expand-Archive editor.zip editor
          $godot = (Get-ChildItem editor -Filter '*.exe' | Where-Object { $_.Name -notmatch 'console' } | Select-Object -First 1).FullName
          "GODOT=$godot" >> $env:GITHUB_ENV
      - name: Unit gates and Windows x64 build
        if: steps.source.outputs.needed == 'True'
        shell: pwsh
        run: |
          python -m unittest discover -s source/tests -p 'test_windows*.py' -v
          if ($LASTEXITCODE) { throw 'Packaging regression failure' }
          python source/tools/windows_ci.py build --runtime vault/runtime --template vault/runtime/template-win64.exe --godot "$env:GODOT" --out player-build
          if ($LASTEXITCODE) { throw 'Build failure' }
      - name: Native EXE startup and live game input/save/restart regression
        if: steps.source.outputs.needed == 'True'
        shell: pwsh
        run: |
          python source/tools/windows_ci.py verify --out player-build
          if ($LASTEXITCODE) { throw 'Windows-native execution/regression failure; player ZIP blocked' }
      - name: ZIP only after all native and game gates pass
        if: steps.source.outputs.needed == 'True'
        shell: pwsh
        run: |
          python source/tools/windows_ci.py archive --out player-build --require-windows
          if ($LASTEXITCODE) { throw 'Delivery gate failure' }
      - name: Private player ZIP download
        if: success() && steps.source.outputs.needed == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: player-build/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Keep failure diagnostics inside the private repository
        if: always() && steps.source.outputs.needed == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: private-windows-diagnostics-${{ github.run_id }}
          path: |
            player-build/*.log
            player-build/evidence/**/*.log
            player-build/evidence/**/*report.json
            player-build/verification.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Privacy and GUI scope
        if: always()
        shell: pwsh
        run: |
          'Full runtime and ZIP remain private. Failed gates never publish a player ZIP.' >> $env:GITHUB_STEP_SUMMARY
          'Operator Windows GUI/audio test remains BLOCKED; native automated input is reported separately.' >> $env:GITHUB_STEP_SUMMARY
