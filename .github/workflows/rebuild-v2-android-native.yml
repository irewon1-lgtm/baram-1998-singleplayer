name: V2 exact candidate native Android
on:
  push:
    branches: [work/rebuild-p3-remediation-20261016]
    paths: ['docs/rebuild/v2/ANDROID_NATIVE_REQUEST.json']
permissions:
  contents: read
concurrency:
  group: baram-v2-android-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    # Standard public-repository runner is free; never substitute a paid larger
    # runner or execute this job in a private repository.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: baram-windows-private
    env:
      GH_TOKEN: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
      PRIVATE_REPO: irewon1-lgtm/baram-windows-private
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Resolve pinned existing private inputs without changing settings
        id: request
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          r = json.load(open('source/docs/rebuild/v2/ANDROID_NATIVE_REQUEST.json'))
          assert r['schema'] == 'baram.v2.android_native_request/1'
          assert re.fullmatch('[0-9a-f]{40}', r['vault_commit'])
          repo = json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['PRIVATE_REPO']]))
          assert repo['private'], 'Existing private candidate vault required'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('vault_commit='+r['vault_commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ steps.request.outputs.vault_commit }}
          token: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
          path: vault
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and verify both exact private APKs
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0 cryptography==46.0.3
          python source/tools/rebuild/v2/test_native_android.py prepare --request source/docs/rebuild/v2/ANDROID_NATIVE_REQUEST.json --vault vault --output private-output --inputs private-candidate-apks
      - name: Prepare standard runner KVM and API35 x86_64 emulator
        shell: bash
        run: |
          mkdir -p private-output/environment
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq > private-output/environment/apt-update.log 2>&1
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor > private-output/environment/apt-install.log 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'build-tools;35.0.1' 'system-images;android-35;google_apis;x86_64' > private-output/environment/sdk.log 2>&1
          "$ANDROID_HOME/emulator/emulator" -accel-check > private-output/environment/accel-check.log 2>&1
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name baram-native --package 'system-images;android-35;google_apis;x86_64' --force > private-output/environment/avd-create.log 2>&1
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['HOME'])/'.android/avd/baram-native.avd/config.ini'
          settings={'hw.lcd.width':'1280','hw.lcd.height':'800','hw.lcd.density':'160','hw.ramSize':'4096','hw.cpu.ncore':'2','hw.keyboard':'yes','hw.gpu.enabled':'yes','hw.gpu.mode':'swiftshader','disk.dataPartition.size':'2048M'}
          lines=p.read_text().splitlines()
          lines=[line for line in lines if line.split('=',1)[0].strip() not in settings]
          p.write_text('\n'.join(lines)+'\n'+'\n'.join(k+'='+v for k,v in settings.items())+'\n')
          PY
          nohup "$ANDROID_HOME/emulator/emulator" -avd baram-native -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -accel on -gpu swiftshader -memory 4096 -cores 2 > private-output/environment/emulator.log 2>&1 &
          echo "$!" > private-output/environment/emulator.pid
          python - <<'PY'
          import os, subprocess, time
          adb=os.environ['ANDROID_HOME']+'/platform-tools/adb'
          until=time.monotonic()+180
          while time.monotonic()<until:
              r=subprocess.run([adb,'-s','emulator-5554','shell','getprop','sys.boot_completed'],capture_output=True,timeout=10)
              if r.stdout.strip()==b'1':break
              time.sleep(2)
          else:raise SystemExit('KVM AVD did not complete boot; do not fall back to TCG')
          subprocess.run([adb,'-s','emulator-5554','shell','input','keyevent','KEYCODE_WAKEUP'],check=True)
          subprocess.run([adb,'-s','emulator-5554','shell','wm','dismiss-keyguard'],check=True)
          PY
      - name: Exact APK ordinary touch, restart and code3-to-code4 update
        shell: bash
        run: |
          python source/tools/rebuild/v2/test_native_android.py run --request source/docs/rebuild/v2/ANDROID_NATIVE_REQUEST.json --output private-output --android-sdk "$ANDROID_HOME" --serial emulator-5554 --budget-seconds 300
      - name: Publish only non-content metadata
        if: always()
        shell: bash
        run: |
          python source/tools/rebuild/v2/test_native_android.py public-summary --request source/docs/rebuild/v2/ANDROID_NATIVE_REQUEST.json --output private-output --summary public-metadata/android-native-summary.json
      - name: Encrypt private screenshots, videos and logs in existing seal format
        if: always()
        shell: bash
        run: |
          mkdir -p private-output
          if [ ! -f private-output/session-public-key.pem ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('source/docs/rebuild/v2/ANDROID_NATIVE_REQUEST.json'))
          Path('private-output/session-public-key.pem').write_text(r['encryption_public_key_pem'],encoding='ascii')
          PY
          fi
          python source/tools/rebuild/p2/work_platform.py seal --source private-output --public-key private-output/session-public-key.pem --output baram-v2-android-native.sealed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baram-v2-android-native-encrypted
          path: baram-v2-android-native.sealed
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baram-v2-android-native-public-metadata
          path: public-metadata/android-native-summary.json
          if-no-files-found: warn
          retention-days: 1
      - name: Stop disposable emulator
        if: always()
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill > /dev/null 2>&1 || true
