name: Windows x64 private player delivery
on:
  push:
    branches: [codex/game-core, 'work/windows-startup-recovery-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-player-${{ github.ref }}
  cancel-in-progress: true
jobs:
  player:
    if: "!contains(github.event.head_commit.message, '[windows-log-transfer]')"
    # Standard hosted runners on this public source repo. Assets and releases
    # are supplied/stored only in the separately verified PRIVATE vault repo.
    runs-on: windows-latest
    timeout-minutes: 25
    environment: baram-windows-private
    env:
      PRIVATE_REPO: ${{ vars.BARAM_PRIVATE_REPOSITORY || 'irewon1-lgtm/baram-windows-private' }}
      GH_TOKEN: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Require an authenticated PRIVATE input/delivery destination
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) { throw 'BLOCKED: one-time private runtime/delivery connection is not configured. No player ZIP will be published.' }
          $repo = gh api "repos/$env:PRIVATE_REPO" | ConvertFrom-Json
          if (-not $repo.private) { throw 'Refuse original assets or ZIPs in a public repository' }
          'BARAM_PRIVATE_DELIVERY_VERIFIED=true' >> $env:GITHUB_ENV
      - name: Read hash-pinned runtime from the private vault
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
          path: vault
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies and pinned official editor
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile editor.zip
          if ((Get-FileHash editor.zip -Algorithm SHA256).Hash.ToLower() -ne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'Editor digest mismatch' }
          Expand-Archive editor.zip editor
          $godot = (Get-ChildItem editor -Filter '*.exe' | Where-Object { $_.Name -notmatch 'console' } | Select-Object -First 1).FullName
          "GODOT=$godot" >> $env:GITHUB_ENV
      - name: Preserve input bytes and build Windows x64 EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force player-build | Out-Null
          python -m unittest discover -s tests -p 'test_windows*.py' -v 2>&1 | Tee-Object player-build/python-tests.log
          if ($LASTEXITCODE) { throw 'Packaging gate failed' }
          python tools/restore_private_runtime.py --vault vault --out vault/runtime 2>&1 | Tee-Object player-build/input-restore.log
          if ($LASTEXITCODE) { throw 'Private input integrity/restore failed; delivery blocked' }
          python tools/windows_ci.py build --runtime vault/runtime --template vault/runtime/template-win64.exe --godot "$env:GODOT" --out player-build 2>&1 | Tee-Object player-build/build-command.log
          if ($LASTEXITCODE) { throw 'Build/export failed' }
      - name: Actual Windows EXE startup and live input/save/restart regression
        shell: pwsh
        run: |
          python tools/windows_ci.py verify --out player-build 2>&1 | Tee-Object player-build/verify-command.log
          if ($LASTEXITCODE) { throw 'Native game regression failed; delivery blocked' }
      - name: Verified player ZIP
        shell: pwsh
        run: |
          python tools/windows_ci.py archive --out player-build --require-windows 2>&1 | Tee-Object player-build/archive-command.log
          if ($LASTEXITCODE) { throw 'ZIP release gate failed' }
      - name: Publish authenticated download in the private vault only
        shell: pwsh
        run: |
          python tools/publish_private_windows.py --repo "$env:PRIVATE_REPO" --out player-build
          if ($LASTEXITCODE) { throw 'Private delivery failed' }
      - name: Keep failure logs inside the private vault
        if: failure() && env.BARAM_PRIVATE_DELIVERY_VERIFIED == 'true'
        shell: pwsh
        run: python tools/publish_private_windows.py --repo "$env:PRIVATE_REPO" --out player-build --diagnostics-only
      - name: Verification scope
        if: always()
        shell: pwsh
        run: |
          'A player ZIP is released only after native EXE and live game regressions pass.' >> $env:GITHUB_STEP_SUMMARY
          'Original assets and player ZIPs are never uploaded to public Actions artifacts.' >> $env:GITHUB_STEP_SUMMARY
          'Operator Windows GUI/audio remains separately BLOCKED until observed.' >> $env:GITHUB_STEP_SUMMARY
  recover-existing-diagnostic:
    if: "contains(github.event.head_commit.message, '[windows-log-transfer]')"
    runs-on: windows-latest
    timeout-minutes: 5
    environment: baram-windows-private
    env:
      GH_TOKEN: ${{ secrets.BARAM_PRIVATE_REPO_TOKEN }}
    steps:
      - name: Recover existing failure log without rerunning the game
        shell: pwsh
        run: |
          $repo = 'irewon1-lgtm/baram-windows-private'
          $metadata = gh api "repos/$repo" | ConvertFrom-Json
          if (-not $metadata.private) { throw 'Private diagnostic destination required' }
          gh release download 'diagnostics-38655218155-1' --repo $repo --pattern private-diagnostics.zip --dir recovered
          if ($LASTEXITCODE) { throw 'Existing private diagnostic download failed' }
          if ((Get-FileHash recovered/private-diagnostics.zip -Algorithm SHA256).Hash.ToLower() -ne '73bc82872d775d0c2826842402d2c1a013d6a3845da2f4b821fd9231f4e83d9c') { throw 'Diagnostic digest mismatch' }
          Expand-Archive recovered/private-diagnostics.zip recovered/logs
          $logs = @{}
          Get-ChildItem recovered/logs -Recurse -File | ForEach-Object {
            $path = [System.IO.Path]::GetRelativePath((Resolve-Path recovered/logs).Path, $_.FullName).Replace('\','/')
            $logs[$path] = Get-Content $_.FullName -Raw -Encoding utf8
          }
          $content = @{source_run=38655218155; logs=$logs} | ConvertTo-Json -Depth 30
          $body = @{message='Recover private logs from existing Windows failure'; content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($content))} | ConvertTo-Json
          [IO.File]::WriteAllText("$pwd/recovered/request.json",$body,[Text.UTF8Encoding]::new($false))
          gh api --method PUT "repos/$repo/contents/diagnostics/recovered-38655218155.json" --input recovered/request.json | Out-Null
          if ($LASTEXITCODE) { throw 'Private diagnostic preservation failed' }
          'Existing Windows failure log recovered privately. No new game execution or player publication.' >> $env:GITHUB_STEP_SUMMARY
